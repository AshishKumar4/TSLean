name = "TSLean"
version = "0.1.0"
defaultTargets = ["TSLean", "AgentCore", "LeanToTypeScriptSemantics"]

[[lean_lib]]
name = "TSLean"
roots = ["TSLean"]

[[lean_lib]]
name = "AgentCore"
roots = ["AgentCore"]

# The Lean-to-TypeScript source and target semantics, and the preservation proofs over them.
# A separate library so the proofs build and audit on their own, without the runtime barrel.
[[lean_lib]]
name = "LeanToTypeScriptSemantics"
roots = ["TSLean.LeanToTypeScript.Semantics"]

[[lean_exe]]
name = "semantics-registry"
root = "TSLean.LeanToTypeScript.Semantics.RegistryReport"

[[lean_exe]]
name = "js-array-scale-tests"
root = "TSLean.JS.ArrayScaleTests"

[[lean_exe]]
name = "js-heap-scale-tests"
root = "TSLean.JS.HeapScaleTests"

[[lean_exe]]
name = "js-model-oracle"
root = "TSLean.JS.Oracle.Main"

[[lean_exe]]
name = "js-coercion-effects-benchmark"
root = "TSLean.JS.CoercionEffectsBenchmark"

# Note: Veil (verse-lab/veil) requires Lean v4.24.0 + Mathlib + lean-smt.
# Our runtime targets Lean v4.33.1 (no external deps), matching Agent Core's
# formal library so the same toolchain compiles both sides of the bridge.
# We implement the Veil transition-system core natively in TSLean/Veil/
# so that structural type-checking works without SMT solvers or Mathlib.
# To use full Veil with SMT automation, build against v4.24.0 separately.
